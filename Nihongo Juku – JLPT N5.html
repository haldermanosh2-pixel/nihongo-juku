*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-family:"Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;font-size:26px;margin:0;letter-spacing:.5px}
h1 span{color:var(--red)}small{color:var(--mute)}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lv button{padding:14px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px Georgia,serif;cursor:pointer;transition:.2s}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--mute);padding:10px 14px;font:600 14px inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:.4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:14px;box-shadow:0 14px 34px -22px #000}
.flash{text-align:center;padding:44px 20px;cursor:pointer;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.big{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:54px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;cursor:pointer}
.btn.p{background:var(--gold);color:#fff;border-color:transparent}
.jp{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;font-size:20px;color:var(--gold)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:500 15px inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent)}
.tag{display:inline-block;font-size:11px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
ruby rt{font-size:.27em;color:var(--gold);letter-spacing:1px;font-family:system-ui,sans-serif}.rm{font-size:20px;color:var(--mute);letter-spacing:1.5px}
.sc{font-size:54px;font-family:Georgia,serif;color:var(--gold)}

.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}

.fp{transform-box:fill-box;transform-origin:center;animation:fall2 var(--t,14s) linear infinite;animation-delay:var(--d,0s)}

:root[data-theme="dark"] .scene,:root:not([data-theme="light"]) .scene{filter:saturate(.7) brightness(.55)}
.wrap{padding-top:26px}
.card{border-radius:24px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}

.lv{gap:10px}

.tabs{background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:18px;padding:5px;gap:4px;border-bottom:none;backdrop-filter:blur(10px)}

const L=["N5"],T=[["v","Vocab"],["k","Kanji"],["w","Write"],["s","Speak"],["g","Grammar"],["q","Mock Test"],["e","Exam"],["l","All Words"]];

else if(tab=="s"){const a=d.v,c=a[i];m.innerHTML=`<small>Say it out loud · ${i+1}/${a.length}</small><div class="bar"><i style="width:${(i+1)/a.length*100}%"></i></div><div class="card" style="text-align:center"><span class="tag">${lv} · Speaking</span><div class="big">${c[0]}</div><p class="jp" style="color:var(--ink);margin:6px 0">${c[1]}</p><p>${c[2]}</p><div class="row" style="margin:14px 0"><button class="btn" onclick="say('${c[1]}')">🔊 Listen</button><button class="btn p" onclick="sayIt()">🎤 Say it</button></div><div id="res" style="min-height:50px"></div><div class="row" style="margin-top:8px"><input id="typed" placeholder="Type here (hiragana / kanji)" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;flex:1;max-width:260px"><button class="btn" onclick="typed()">Check</button></div><div class="row"><button class="btn" onclick="go(-1)">← Prev</button><button class="btn" onclick="go(1)">Next →</button></div></div>`}

function initCv(){const c=$("cv");if(!c)return;const x=c.getContext("2d");x.lineCap="round";x.lineJoin="round";x.lineWidth=12;x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#b8892b";let on=false,lx=0,ly=0;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.onpointerdown=e=>{on=true;[lx,ly]=p(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!on)return;const[a,b]=p(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(a,b);x.stroke();lx=a;ly=b};c.onpointerup=c.onpointercancel=()=>{on=false}}

function listen(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return cb(null,"Voice input is not supported in this browser. Try Chrome, or type below.");const msgs={"not-allowed":"Microphone is blocked. Click the lock icon in the address bar, allow Microphone, then reload. Or open the link in a separate Chrome tab. Meanwhile, type below.","service-not-allowed":"Microphone service is blocked. Type below instead.","no-speech":"I didn't hear anything. Please try again.","audio-capture":"No microphone found.","network":"Network error."};let done=false;try{const r=new R();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{done=true;cb(e.results[0][0].transcript)};r.onerror=e=>{done=true;cb(null,msgs[e.error]||("Mic error: "+e.error))};r.onend=()=>{if(!done)cb(null,"I didn't hear anything. Please try again.")};r.start()}catch(e){cb(null,"Could not start the microphone: "+e.message)}}
const nm=s=>String(s).replace(/[\s。、!?！？]/g,"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).toLowerCase();
